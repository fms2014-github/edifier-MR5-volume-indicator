[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Variables]
MR5Volume=--
MR5Status=대기 중
AUTO_CONNECT=Y
@Include=#@#config.ini

[MeasureRunPython]
Measure=Plugin
Plugin=RunCommand
Program=""#@#MR5Service\MR5Service.exe""
Parameter=""#SETTINGSPATH#Rainmeter.ini" "#PROGRAMPATH#Rainmeter.exe""
State=Hide
OutputType=ANSI

[MeasureAutoConnect]
Measure=String
String=#AUTO_CONNECT#
UpdateDivider=-1
IfMatch=(?i)^Y$
IfMatchAction=[!CommandMeasure MeasureRunPython "Run"]

[MeasureKillPython]
Measure=Plugin
Plugin=RunCommand
Parameter=cmd.exe /c echo stop > "#@#stop.txt"
State=Hide

[MeterBackground]
Meter=Shape
; 💡 스킨 높이를 110에서 130으로 살짝 늘려서 에러 메시지 공간을 확보했습니다.
Shape=Rectangle 0,0,220,130,10 | Fill Color 20,20,20,220 | StrokeWidth 1 | Stroke Color 50,50,50,255

[StyleMR5Text]
FontFace=Pretendard
FontWeight=600
AntiAlias=1

[MeterTitle]
Meter=String
MeterStyle=StyleMR5Text
X=110
Y=10
StringAlign=Center
FontColor=255,255,255,150
FontSize=10
Text=Edifier MR5

[MeterSettingsButton]
Meter=String
X=203
Y=17
W=24
H=24
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=11
FontColor=255,255,255,180
AntiAlias=1
Text=[\xE713]
SolidColor=0,0,0,1
ToolTipText=설정 파일 열기 (config.ini)
LeftMouseUpAction=["notepad.exe" "#@#config.ini"]

[MeterVolume]
Meter=String
MeterStyle=StyleMR5Text
X=110
Y=35
StringAlign=Center
FontColor=255,255,255,255
FontSize=24
Text=#MR5Volume#
DynamicVariables=1

; 💡 [새로 추가된 부분] 상태 및 에러 메시지를 눈에 띄게 보여주는 전용 텍스트입니다.
[MeterStatus]
Meter=String
MeterStyle=StyleMR5Text
X=110
Y=75
StringAlign=Center
FontColor=255,200,100,255
FontSize=9
Text=#MR5Status#
ClipString=1
W=200
DynamicVariables=1

[MeterConnectButton]
Meter=String
MeterStyle=StyleMR5Text
X=40
Y=100
FontColor=100,255,100,255
FontSize=10
Text=[ 연결 ]
SolidColor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureRunPython "Run"]
Cursor=Hand

[MeterDisconnectButton]
Meter=String
MeterStyle=StyleMR5Text
X=180
Y=100
StringAlign=Right
FontColor=255,100,100,255
FontSize=10
Text=[ 해제 ]
SolidColor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureKillPython "Run"][!SetVariable MR5Status "연결 해제됨"][!SetVariable MR5Volume "--"][!Update]
Cursor=Hand
